repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --verbose
          - --scopes
          - core,config,commands,context,providers,snacks,state,just,readme,plan,dev
          - feat
          - fix
          - docs
          - chore
          - test
          - refactor
  - repo: local
    hooks:
      - id: codex-fmt-check
        name: codex fmt-check
        entry: mise exec -- just fmt-check
        language: system
        pass_filenames: false
      - id: codex-lint
        name: codex lint
        entry: mise exec -- just lint
        language: system
        pass_filenames: false
      - id: codex-md-fmt-check
        name: codex md-fmt-check
        entry: mise exec -- mdformat --number --check docs/ README.md
        language: system
        pass_filenames: false
      - id: codex-test-unit
        name: codex test-unit
        entry: mise exec -- just test-unit
        language: system
        pass_filenames: false
      - id: codex-test-contract
        name: codex test-contract
        entry: mise exec -- just test-contract
        language: system
        pass_filenames: false

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        name: conventional commit check
        stages: [commit-msg]
        args:
          - --verbose
          - chore
          - docs
          - enhance
          - feat
          - fix
          - perf
          - build
          - refactor
          - release
          - test
  - repo: local
    hooks:
      - id: fmt-check
        name: fmt-check
        entry: mise exec -- just fmt-check
        language: system
        pass_filenames: false
      - id: lint
        name: lint
        entry: mise exec -- just lint
        language: system
        pass_filenames: false
      - id: md-fmt-check
        name: md-fmt-check
        entry: mise exec -- mdformat --number --check doc/ README.md
        language: system
        pass_filenames: false
      - id: test-unit
        name: test-unit
        entry: mise exec -- just test-unit
        language: system
        pass_filenames: false
      - id: test-contract
        name: test-contract
        entry: mise exec -- just test-contract
        language: system
        pass_filenames: false

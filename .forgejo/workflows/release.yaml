name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'RELEASE:') || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure required tools
        shell: bash
        run: |
          bash ./.forgejo/scripts/ensure-tools.sh \
            git:git \
            curl:curl \
            python3:python3

      - name: Extract tag from commit message
        id: extract_tag
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          # Get first line of commit message
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n 1)
          TAG=$(echo "$FIRST_LINE" | sed -nE 's/^[Rr][Ee][Ll][Ee][Aa][Ss][Ee]: *(v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]{1,3}))?).*/\1/p')

          if [ -z "$TAG" ]; then
            echo "Error: No tag found in commit message"
            exit 1
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]{1,3}))?$ ]]; then
            echo "Error: Tag must be v0.0.0 or use one of: -alpha.N, -beta.N, -rc.N (where N is 0-999)"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v$TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Creating release for tag: $TAG"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          if git show-ref --tags --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag ${TAG} already exists, skipping tag creation"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.tag_exists != 'true'
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@noreply.codeberg.org"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Get previous tag
        id: get_previous_tag
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          PREVIOUS_TAG="${{ steps.get_previous_tag.outputs.previous_tag }}"

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${TAG}" 2>/dev/null || git log --pretty=format:"- %s (%h)" -20)
            CHANGELOG_LINE="**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" -20)
            CHANGELOG_LINE="**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          fi

          NOTES="## What's Changed

          ${COMMITS}

          ${CHANGELOG_LINE}"

          echo "$NOTES" > release_notes.md
          echo "Generated release notes"

      - name: Check if release exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          if [ "$STATUS" = "200" ]; then
            echo "Release for ${TAG} already exists, skipping"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Forgejo release
        if: steps.check_release.outputs.release_exists != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.extract_tag.outputs.tag }}"
          NOTES=$(cat release_notes.md)

          NOTES_ESCAPED=$(printf '%s' "$NOTES" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          curl --fail-with-body -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": ${NOTES_ESCAPED},
              \"draft\": false,
              \"prerelease\": ${PRERELEASE}
            }"

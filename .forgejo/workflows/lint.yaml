name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &applicable_paths
      - "**/*.lua"
      - "**/*.md"
      - "justfile"
      - "mise.toml"
      - "selene.toml"
      - ".stylua.toml"
      - ".forgejo/workflows/lint.yaml"
  pull_request:
    types: [opened, synchronize]
    paths: *applicable_paths

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Format Check
            command: fmt-check
          - name: Lint
            command: lint
    name: ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure required tools
        shell: bash
        run: |
          bash ./.forgejo/scripts/ensure-tools.sh \
            --python-venv \
            wget:wget \
            git:git \
            tar:tar \
            python3:python3 \
            pipx:pipx

      - name: Install Just
        run: |
          case "$(uname -m)" in
            x86_64) JUST_ARCH="x86_64-unknown-linux-musl" ;;
            aarch64|arm64) JUST_ARCH="aarch64-unknown-linux-musl" ;;
            *)
              echo "Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          JUST_VERSION="1.43.0"
          JUST_TARBALL="just-${JUST_VERSION}-${JUST_ARCH}.tar.gz"
          JUST_URL="https://github.com/casey/just/releases/download/${JUST_VERSION}/${JUST_TARBALL}"

          wget -qO- "$JUST_URL" | tar xzf - -C /usr/local/bin just
          just --version

      - name: Install Mise
        run: |
          wget -qO- https://mise.run | sh
          ~/.local/bin/mise --version

      - name: Install uv
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/uv --version

      - name: Install lint toolchain
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN
          ~/.local/bin/mise install

      - name: Run check
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN
          ~/.local/bin/mise exec -- just "${{ matrix.command }}"
